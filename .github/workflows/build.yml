name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git

      - uses: actions/checkout@v4

      - name: Install clang-format
        run: apt-get update -qq && apt-get install -y -qq clang-format

      - name: Check code style
        run: |
          find . \( -name '*.cpp' -o -name '*.h' \) \
            -exec bash -c 'diff -q "$1" <(clang-format "$1") > /dev/null' _ {} \; -o \
            -exec bash -c 'echo "Style violation: $1"; exit 1' _ \;

  build:
    runs-on: ubuntu-24.04
    container: debian:trixie
    strategy:
      matrix:
        build_type: [Debug, RelWithDebInfo]
      fail-fast: false

    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq \
            cmake ninja-build g++ \
            qt6-base-dev qt6-tools-dev \
            libgl1-mesa-dev \
            curl jq

      - name: Install lingmo-theme from latest release
        run: |
          curl -sL -o /tmp/lt-release.json \
            https://api.github.com/repos/Matrinsoft/lingmo-theme/releases/latest
          DEB_DEV=$(jq -r '.assets[] | select(type == "object") | select(.name | test("liblingmotheme-dev_.*_amd64\\.deb")) | .browser_download_url' /tmp/lt-release.json)
          DEB_LIB=$(jq -r '.assets[] | select(type == "object") | select(.name | test("liblingmotheme1_.*_amd64\\.deb") and (.name | contains("dbgsym") | not)) | .browser_download_url' /tmp/lt-release.json)
          curl -sL -o /tmp/lingmo-theme-dev.deb "$DEB_DEV"
          curl -sL -o /tmp/lingmo-theme-lib.deb "$DEB_LIB"
          dpkg -i /tmp/lingmo-theme-lib.deb /tmp/lingmo-theme-dev.deb || apt-get install -f -y
          rm -f /tmp/lingmo-theme-*.deb /tmp/lt-release.json

      - name: Configure
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTING=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }} \
            -DCMAKE_UNITY_BUILD=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests (Debug only)
        if: matrix.build_type == 'Debug'
        run: ctest --test-dir build --output-on-failure --timeout 60

      - name: Install
        run: cmake --install build --prefix install_dir

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lingmo-style-${{ matrix.build_type }}
          path: install_dir/
