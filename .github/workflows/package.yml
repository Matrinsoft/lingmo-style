name: Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-24.04
    container: debian:trixie

    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq \
            build-essential cmake debhelper dpkg-dev \
            qt6-base-dev \
            libgl1-mesa-dev \
            curl jq

      - name: Install lingmo-theme from latest release
        run: |
          curl -sL -o /tmp/lt-release.json \
            https://api.github.com/repos/Matrinsoft/lingmo-theme/releases/latest
          DEB_DEV=$(jq -r '.assets[] | select(type == "object") | select(.name | test("liblingmotheme-dev_.*_amd64\\.deb")) | .browser_download_url' /tmp/lt-release.json)
          DEB_LIB=$(jq -r '.assets[] | select(type == "object") | select(.name | test("liblingmotheme1_.*_amd64\\.deb") and (.name | contains("dbgsym") | not)) | .browser_download_url' /tmp/lt-release.json)
          curl -sL -o /tmp/lingmo-theme-dev.deb "$DEB_DEV"
          curl -sL -o /tmp/lingmo-theme-lib.deb "$DEB_LIB"
          dpkg -i /tmp/lingmo-theme-lib.deb /tmp/lingmo-theme-dev.deb || apt-get install -f -y
          rm -f /tmp/lingmo-theme-*.deb /tmp/lt-release.json

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p artifacts
          mv ../*.deb ../*.buildinfo ../*.changes artifacts/ 2>/dev/null || true

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: lingmo-style-deb
          path: artifacts/

  rpm:
    runs-on: ubuntu-24.04
    container: fedora:44

    steps:
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y cmake ninja-build rpm-build \
            qt6-qtbase-devel \
            mesa-libGL-devel \
            curl jq

      - name: Install lingmo-theme from latest release
        run: |
          curl -sL -o /tmp/lt-release.json \
            https://api.github.com/repos/Matrinsoft/lingmo-theme/releases/latest
          RPM_DEVEL=$(jq -r '.assets[] | select(type == "object") | select(.name | test("lingmo-theme-devel-.*\\.rpm") and (.name | test("debug") | not)) | .browser_download_url' /tmp/lt-release.json)
          RPM_LIBS=$(jq -r '.assets[] | select(type == "object") | select(.name | test("lingmo-theme-libs-.*\\.rpm") and (.name | test("debug") | not)) | .browser_download_url' /tmp/lt-release.json)
          curl -sL -o /tmp/lingmo-theme-devel.rpm "$RPM_DEVEL"
          curl -sL -o /tmp/lingmo-theme-libs.rpm "$RPM_LIBS"
          dnf install -y /tmp/lingmo-theme-libs.rpm /tmp/lingmo-theme-devel.rpm
          rm -f /tmp/lingmo-theme-*.rpm /tmp/lt-release.json

      - name: Build RPM
        run: |
          mkdir -p /tmp/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cd .. && tar czf /tmp/rpmbuild/SOURCES/lingmo-style-1.0.0.tar.gz \
            --transform='s,^lingmo-style,lingmo-style-1.0.0,' \
            lingmo-style
          cd lingmo-style
          cp rpm/lingmo-style.spec /tmp/rpmbuild/SPECS/
          rpmbuild -ba /tmp/rpmbuild/SPECS/lingmo-style.spec \
            --define "_topdir /tmp/rpmbuild"
          mkdir -p artifacts
          cp /tmp/rpmbuild/RPMS/**/*.rpm artifacts/ 2>/dev/null || true

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: lingmo-style-rpm
          path: artifacts/
